# ==========================================================
# 🔥 NOVA CONFIGURAÇÃO (POSTGRESQL) - VERSÃO LIMPA 🔥
# ==========================================================

# ⬅️ SEU BANCO. "postgres" é o padrão. Se criou outro, mude o nome aqui.
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.driverClassName=org.postgresql.Driver

# ⬅️ SEU USUÁRIO DO POSTGRES
spring.datasource.username=postgres

# ⬅️ SUA SENHA REAL (a que você botou "123456")
spring.datasource.password=123456

# Define o dialeto do Hibernate para POSTGRES
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ==========================================================
# CONFIGURAÇÕES JPA (JÁ EXISTIAM E VAMOS MANTER)
# ==========================================================
# (O console do H2 fica desabilitado)
# spring.h2.console.enabled=false 

# Configuração do JPA (agora sem o comentário na frente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações JWT (Manter igual)
jwt.secret=chaveSecretaForteComNoMinimo512Bits
jwt.expiration=86400000

# Configuração do servidor (Manter igual)
server.port=8080